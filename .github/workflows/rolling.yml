name: rolling

on:
  pull_request:
    branches:
      - rolling
  push:
    branches:
      - rolling
jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-resolute-ros-rolling-ros-base:master
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rolling
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: roboligo roboligo_cli roboligo_common roboligo_connector roboligo_interfaces roboligo_states roboligo_system roboligo_connector_mavros roboligo_robot_drone
          target-ros2-distro: rolling
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
          colcon-mixin-name: coverage-gcc
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml