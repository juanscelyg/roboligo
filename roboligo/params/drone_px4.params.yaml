states_node:
  ros__parameters:
    use_sim_time: true
    robot_types: [drone]
    drone:
      plugin: roboligo_robot_drone/RoboligoRobotDrone

connector_node:
  ros__parameters:
    use_sim_time: true
    connector_types: [px4]
    px4:
      plugin: roboligo_connector_px4/RoboligoConnectorPX4
      init_alt: 0.75

roboligo_node:
  ros__parameters:
    use_sim_time: true
    robot_name: droncito
    input_topic: /cmd_vel
    stamped: false

